<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>Controle de Acesso</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <main class="container">


        <!-- =====================================================
             CABEÇALHO
        ====================================================== -->

        <header class="cabecalho">

            <div class="titulo">

                CONTROLE DE ACESSO -
                {{ modo_terminal }}

            </div>


            <div
                class="relogio"
                id="relogio"
            >

                00:00

            </div>

        </header>


        <!-- =====================================================
             CONTEÚDO
        ====================================================== -->

        <section class="conteudo">

            <div class="area-reconhecimento">


                <!-- =================================================
                     ROSTO
                ================================================== -->

                <div
                    class="moldura-rosto procurando"
                    id="moldura-rosto"
                >


                    <div
                        class="camera"
                        id="camera"
                    >

                        <video
                            id="video"
                            autoplay
                            playsinline
                            muted
                        ></video>


                        <canvas
                            id="canvas"
                            style="display: none"
                        ></canvas>

                    </div>


                    <!-- =============================================
                         CONTORNO SVG
                    ============================================== -->

                    <svg
                        class="contorno-svg"
                        viewBox="0 0 285 370"
                        preserveAspectRatio="none"
                    >

                        <ellipse
                            class="contorno-elipse"
                            cx="142.5"
                            cy="185"
                            rx="138"
                            ry="180"
                        ></ellipse>

                    </svg>

                </div>


                <!-- =================================================
                     INFORMAÇÕES
                ================================================== -->

                <div class="informacoes">

                    <h1 id="nome-pessoa">
                        Posicione seu rosto
                    </h1>


                    <p
                        id="mensagem"
                        class="mensagem"
                    >
                        Olhe para a câmera
                    </p>


                    <div
                        id="status"
                        class="status aguardando"
                    >

                        <span class="status-icone">
                            ●
                        </span>


                        <span id="status-texto">
                            Aguardando reconhecimento
                        </span>

                    </div>

                </div>

            </div>

        </section>


        <!-- =====================================================
             RODAPÉ
        ====================================================== -->

        <footer>

            <span class="indicador-online"></span>

            Terminal {{ modo_terminal }}

        </footer>

    </main>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script>

        // =========================================================
        // MODO DO TERMINAL
        // =========================================================

        const MODO_TERMINAL =
            "{{ modo_terminal }}";


        // =========================================================
        // CONFIGURAÇÕES
        // =========================================================

        const TEMPO_RESULTADO =
            2500;


        // =========================================================
        // ELEMENTOS
        // =========================================================

        const video =
            document.getElementById(
                "video"
            );


        const canvas =
            document.getElementById(
                "canvas"
            );


        const moldura =
            document.getElementById(
                "moldura-rosto"
            );


        const nomePessoa =
            document.getElementById(
                "nome-pessoa"
            );


        const mensagem =
            document.getElementById(
                "mensagem"
            );


        const status =
            document.getElementById(
                "status"
            );


        const statusTexto =
            document.getElementById(
                "status-texto"
            );


        // =========================================================
        // ESTADOS
        // =========================================================

        let verificacaoEmAndamento =
            false;


        let processamentoEmAndamento =
            false;


        let aguardandoPessoaSair =
            false;


        let intervaloVerificacao =
            null;


        // =========================================================
        // RELÓGIO
        // =========================================================

        function atualizarRelogio() {

            const agora =
                new Date();


            const horas =
                agora
                    .getHours()
                    .toString()
                    .padStart(
                        2,
                        "0"
                    );


            const minutos =
                agora
                    .getMinutes()
                    .toString()
                    .padStart(
                        2,
                        "0"
                    );


            document.getElementById(
                "relogio"
            ).innerText =
                horas
                +
                ":"
                +
                minutos;

        }


        atualizarRelogio();


        setInterval(
            atualizarRelogio,
            1000
        );


        // =========================================================
        // CÂMERA
        // =========================================================

        async function iniciarCamera() {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {

                            facingMode:
                                "user",

                            width: {
                                ideal: 640
                            },

                            height: {
                                ideal: 480
                            }

                        },

                        audio: false

                    });


                video.srcObject =
                    stream;


                video.onloadedmetadata =
                    function () {

                        iniciarVerificacao();

                    };

            }

            catch (erro) {

                console.error(
                    "Erro ao iniciar câmera:",
                    erro
                );


                nomePessoa.innerText =
                    "Câmera indisponível";


                mensagem.innerText =
                    "Verifique a permissão da câmera";


                statusTexto.innerText =
                    "Câmera indisponível";

            }

        }


        // =========================================================
        // VERIFICAÇÃO PERIÓDICA
        // =========================================================

        function iniciarVerificacao() {

            if (
                intervaloVerificacao
                !==
                null
            ) {

                return;

            }


            intervaloVerificacao =
                setInterval(

                    function () {

                        if (
                            !verificacaoEmAndamento
                            &&
                            !processamentoEmAndamento
                        ) {

                            verificarFrameAtual();

                        }

                    },

                    800

                );

        }


        // =========================================================
        // GERAR IMAGEM
        // =========================================================

        function gerarImagemAtual() {

            if (
                video.videoWidth === 0
                ||
                video.videoHeight === 0
            ) {

                return null;

            }


            canvas.width =
                video.videoWidth;


            canvas.height =
                video.videoHeight;


            const contexto =
                canvas.getContext(
                    "2d"
                );


            contexto.drawImage(

                video,

                0,
                0,

                canvas.width,
                canvas.height

            );


            return canvas.toDataURL(

                "image/jpeg",

                0.90

            );

        }


        // =========================================================
        // VERIFICAR ROSTO
        // =========================================================

        async function verificarFrameAtual() {

            const imagem =
                gerarImagemAtual();


            if (!imagem) {

                return;

            }


            verificacaoEmAndamento =
                true;


            try {

                const resposta =
                    await fetch(

                        "/verificar-rosto",

                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    imagem:
                                        imagem

                                })

                        }

                    );


                if (!resposta.ok) {

                    throw new Error(
                        "Erro HTTP: "
                        +
                        resposta.status
                    );

                }


                const dados =
                    await resposta.json();


                // =================================================
                // AGUARDA PESSOA SAIR
                // =================================================

                if (
                    aguardandoPessoaSair
                ) {

                    if (
                        !dados.rosto_detectado
                    ) {

                        aguardandoPessoaSair =
                            false;


                        voltarParaAguardando();

                    }


                    return;

                }


                // =================================================
                // SEM ROSTO
                // =================================================

                if (
                    !dados.rosto_detectado
                ) {

                    nomePessoa.innerText =
                        "Posicione seu rosto";


                    mensagem.innerText =
                        "Olhe para a câmera";


                    statusTexto.innerText =
                        "Aguardando reconhecimento";


                    return;

                }


                // =================================================
                // FORA DA POSIÇÃO
                // =================================================

                if (
                    !dados.posicionado
                ) {

                    nomePessoa.innerText =
                        "Posicione seu rosto";


                    mensagem.innerText =
                        dados.mensagem;


                    statusTexto.innerText =
                        "Ajuste sua posição";


                    return;

                }


                // =================================================
                // ROSTO OK
                // =================================================

                await processarAcesso(
                    imagem
                );

            }

            catch (erro) {

                console.error(
                    "Erro na verificação:",
                    erro
                );


                mensagem.innerText =
                    "Erro na verificação";

            }

            finally {

                verificacaoEmAndamento =
                    false;

            }

        }


        // =========================================================
        // PROCESSAR ACESSO
        // =========================================================

        async function processarAcesso(
            imagem
        ) {

            if (
                processamentoEmAndamento
            ) {

                return;

            }


            processamentoEmAndamento =
                true;


            // =====================================================
            // ESTADO PROCESSANDO
            // =====================================================

            moldura.classList.remove(
                "procurando"
            );


            moldura.classList.remove(
                "reconhecido"
            );


            moldura.classList.remove(
                "negado"
            );


            moldura.classList.add(
                "processando"
            );


            status.classList.remove(
                "aguardando"
            );


            status.classList.remove(
                "autorizado"
            );


            status.classList.remove(
                "negado"
            );


            status.classList.add(
                "processando-status"
            );


            nomePessoa.innerText =
                "Identificando...";


            mensagem.innerText =
                "Aguarde";


            statusTexto.innerText =
                "Processando";


            try {

                const resposta =
                    await fetch(

                        "/processar-acesso",

                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    modo:
                                        MODO_TERMINAL,

                                    imagem:
                                        imagem

                                })

                        }

                    );


                if (!resposta.ok) {

                    throw new Error(
                        "Erro HTTP: "
                        +
                        resposta.status
                    );

                }


                const dados =
                    await resposta.json();


                await mostrarResultado(
                    dados
                );

            }

            catch (erro) {

                console.error(
                    "Erro ao processar acesso:",
                    erro
                );


                mostrarErro(
                    "Erro ao processar acesso"
                );

            }

        }


        // =========================================================
        // MOSTRAR RESULTADO
        // =========================================================

        async function mostrarResultado(
            dados
        ) {

            moldura.classList.remove(
                "processando"
            );


            status.classList.remove(
                "processando-status"
            );


            // =====================================================
            // PESSOA CADASTRADA - ENTRADA
            // =====================================================

            if (
                dados.evento
                ===
                "ENTRADA"
            ) {

                aplicarVerde();


                nomePessoa.innerText =
                    dados.nome;


                mensagem.innerText =
                    "Entrada registrada";


                statusTexto.innerText =
                    "Acesso liberado";

            }


            // =====================================================
            // PESSOA CADASTRADA - SAÍDA
            // =====================================================

            else if (
                dados.evento
                ===
                "SAIDA"
            ) {

                aplicarVerde();


                nomePessoa.innerText =
                    dados.nome;


                mensagem.innerText =
                    "Saída registrada";


                statusTexto.innerText =
                    "Saída autorizada";

            }


            // =====================================================
            // PESSOA CADASTRADA - JÁ PRESENTE
            // =====================================================

            else if (
                dados.evento
                ===
                "JA_PRESENTE"
            ) {

                aplicarVerde();


                nomePessoa.innerText =
                    dados.nome;


                mensagem.innerText =
                    "Entrada já registrada";


                statusTexto.innerText =
                    "Acesso liberado";

            }


            // =====================================================
            // PESSOA CADASTRADA - SEM ENTRADA
            // =====================================================

            else if (
                dados.evento
                ===
                "ENTRADA_NAO_LOCALIZADA"
            ) {

                aplicarVermelho();


                nomePessoa.innerText =
                    dados.nome
                    ||
                    "Pessoa identificada";


                mensagem.innerText =
                    "Entrada não localizada";


                statusTexto.innerText =
                    "Saída não registrada";

            }


            // =====================================================
            // VISITANTE NOVO - ENTRADA
            // =====================================================

            else if (
                dados.evento
                ===
                "ENTRADA_VISITANTE"
            ) {

                aplicarVerde();


                nomePessoa.innerText =
                    "Pessoa não identificada";


                mensagem.innerText =
                    "Entrada registrada como visitante";


                statusTexto.innerText =
                    "Acesso liberado";

            }


            // =====================================================
            // VISITANTE JÁ ESTÁ PRESENTE
            // =====================================================

            else if (
                dados.evento
                ===
                "VISITANTE_JA_PRESENTE"
            ) {

                aplicarVerde();


                nomePessoa.innerText =
                    "Visitante";


                mensagem.innerText =
                    "Entrada já registrada";


                statusTexto.innerText =
                    "Acesso liberado";

            }


            // =====================================================
            // VISITANTE - SAÍDA
            // =====================================================

            else if (
                dados.evento
                ===
                "SAIDA_VISITANTE"
            ) {

                aplicarVerde();


                nomePessoa.innerText =
                    "Visitante";


                mensagem.innerText =
                    "Saída registrada";


                statusTexto.innerText =
                    "Saída autorizada";

            }


            // =====================================================
            // VISITANTE NÃO LOCALIZADO NA SAÍDA
            // =====================================================

            else if (
                dados.evento
                ===
                "VISITANTE_NAO_LOCALIZADO"
            ) {

                aplicarVermelho();


                nomePessoa.innerText =
                    "Pessoa não identificada";


                mensagem.innerText =
                    "Registro de entrada não localizado";


                statusTexto.innerText =
                    "Saída não registrada";

            }


            // =====================================================
            // NÃO RECONHECIDO
            // =====================================================

            else if (
                dados.evento
                ===
                "NAO_RECONHECIDO"
            ) {

                aplicarVermelho();


                nomePessoa.innerText =
                    "Pessoa não identificada";


                mensagem.innerText =
                    "Cadastro não encontrado";


                statusTexto.innerText =
                    "Não autorizado";

            }


            // =====================================================
            // ERRO AO CRIAR VISITANTE
            // =====================================================

            else if (
                dados.evento
                ===
                "ERRO_VISITANTE"
            ) {

                aplicarVermelho();


                nomePessoa.innerText =
                    "Erro no registro";


                mensagem.innerText =
                    "Não foi possível registrar visitante";


                statusTexto.innerText =
                    "Tente novamente";

            }


            // =====================================================
            // OUTRO ERRO
            // =====================================================

            else {

                aplicarVermelho();


                nomePessoa.innerText =
                    "Não foi possível processar";


                mensagem.innerText =
                    dados.mensagem
                    ||
                    "Tente novamente";


                statusTexto.innerText =
                    "Erro";

            }


            // =====================================================
            // TEMPO PARA VISUALIZAR RESULTADO
            // =====================================================

            await esperar(
                TEMPO_RESULTADO
            );


            // =====================================================
            // "PODE PROSSEGUIR"
            // APENAS EM EVENTOS LIBERADOS
            // =====================================================

            if (

                dados.evento
                ===
                "ENTRADA"

                ||

                dados.evento
                ===
                "SAIDA"

                ||

                dados.evento
                ===
                "JA_PRESENTE"

                ||

                dados.evento
                ===
                "ENTRADA_VISITANTE"

                ||

                dados.evento
                ===
                "SAIDA_VISITANTE"

                ||

                dados.evento
                ===
                "VISITANTE_JA_PRESENTE"

            ) {

                mensagem.innerText =
                    "Pode prosseguir";

            }


            // =====================================================
            // AGUARDA ROSTO SAIR
            // =====================================================

            aguardandoPessoaSair =
                true;


            processamentoEmAndamento =
                false;

        }


        // =========================================================
        // VERDE
        // =========================================================

        function aplicarVerde() {

            moldura.classList.remove(
                "negado"
            );


            moldura.classList.remove(
                "processando"
            );


            moldura.classList.remove(
                "procurando"
            );


            moldura.classList.add(
                "reconhecido"
            );


            status.classList.remove(
                "negado"
            );


            status.classList.remove(
                "processando-status"
            );


            status.classList.remove(
                "aguardando"
            );


            status.classList.add(
                "autorizado"
            );

        }


        // =========================================================
        // VERMELHO
        // =========================================================

        function aplicarVermelho() {

            moldura.classList.remove(
                "reconhecido"
            );


            moldura.classList.remove(
                "processando"
            );


            moldura.classList.remove(
                "procurando"
            );


            moldura.classList.add(
                "negado"
            );


            status.classList.remove(
                "autorizado"
            );


            status.classList.remove(
                "processando-status"
            );


            status.classList.remove(
                "aguardando"
            );


            status.classList.add(
                "negado"
            );

        }


        // =========================================================
        // ERRO
        // =========================================================

        function mostrarErro(
            texto
        ) {

            processamentoEmAndamento =
                false;


            aplicarVermelho();


            nomePessoa.innerText =
                "Erro";


            mensagem.innerText =
                texto;


            statusTexto.innerText =
                "Tente novamente";

        }


        // =========================================================
        // VOLTAR PARA AGUARDANDO
        // =========================================================

        function voltarParaAguardando() {

            moldura.classList.remove(
                "reconhecido"
            );


            moldura.classList.remove(
                "negado"
            );


            moldura.classList.remove(
                "processando"
            );


            moldura.classList.add(
                "procurando"
            );


            status.classList.remove(
                "autorizado"
            );


            status.classList.remove(
                "negado"
            );


            status.classList.remove(
                "processando-status"
            );


            status.classList.add(
                "aguardando"
            );


            nomePessoa.innerText =
                "Posicione seu rosto";


            mensagem.innerText =
                "Olhe para a câmera";


            statusTexto.innerText =
                "Aguardando reconhecimento";


            processamentoEmAndamento =
                false;

        }


        // =========================================================
        // ESPERA
        // =========================================================

        function esperar(
            milissegundos
        ) {

            return new Promise(

                resolve =>
                    setTimeout(
                        resolve,
                        milissegundos
                    )

            );

        }


        // =========================================================
        // INICIAR
        // =========================================================

        iniciarCamera();

    </script>

</body>

</html>
